<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<script>
/* Strip GTM Conversion Linker query keys so the address bar is shareable.
   Drops _gl, gclid, dclid, gbraid, wbraid, gclsrc, and any _gcl_* key.
   Keeps lang and every other param, and the hash. replaceState only — no reload.
   Runs before the logo-language script, which still reads ?lang= from the cleaned URL. */
(function () {
  try {
    var search = location.search;
    if (!search || search.length < 2) return;
    var named = {
      "_gl": 1, "gclid": 1, "dclid": 1, "gbraid": 1, "wbraid": 1, "gclsrc": 1
    };
    var parts = search.substring(1).split("&");
    var keep = [];
    var dropped = false;
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i];
      if (!part) continue;
      var eq = part.indexOf("=");
      var rawKey = eq === -1 ? part : part.substring(0, eq);
      var key = rawKey;
      try { key = decodeURIComponent(rawKey.replace(/\+/g, " ")).toLowerCase(); } catch (e) {}
      if (named[key] || key.indexOf("_gcl_") === 0) { dropped = true; continue; }
      keep.push(part);
    }
    if (!dropped) return;
    history.replaceState(history.state, "", location.pathname + (keep.length ? "?" + keep.join("&") : "") + location.hash);
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sakeni 360° | Biograpi Living</title>
<link rel="stylesheet" href="pannellum.css">
<style>
  html,body{margin:0;padding:0;height:100%;background:#576EB1;overflow:hidden;}
  #pano{width:100%;height:100vh;background:#576EB1;}
  .bare-logo{position:absolute;top:16px;left:16px;z-index:6;height:52px;width:auto;
    filter:drop-shadow(0 3px 10px rgba(0,0,0,.45));pointer-events:none;user-select:none;}
  .view-switch{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);
    z-index:6;display:flex;gap:4px;padding:4px;border-radius:999px;max-width:94vw;
    background:rgba(22,16,26,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    box-shadow:0 4px 18px rgba(0,0,0,.35);}
  .view-switch button{border:0;cursor:pointer;border-radius:999px;white-space:nowrap;
    font:700 14px/1 -apple-system,Segoe UI,Roboto,'Noto Sans Georgian',sans-serif;
    letter-spacing:.02em;color:#EEECD5;background:transparent;padding:10px 18px;transition:.15s;}
  .view-switch button.active{background:#EEECD5;color:#16101A;}
  .view-switch button:not(.active):hover{background:rgba(238,236,213,.14);}
  @media (max-width:600px){
    .bare-logo{height:42px;top:12px;left:12px;}
    .view-switch{gap:2px;padding:3px;}
    .view-switch button{padding:9px 12px;font-size:12px;}
  }
  /* BGP logo link v1 */
  .bgp-logo-link .bare-logo{pointer-events:auto;cursor:pointer;-webkit-touch-callout:none;}
  .bgp-logo-link{-webkit-tap-highlight-color:transparent;}
</style>
</head>
<body>
<div id="pano"></div>
<a id="bgp-logo-link" class="bgp-logo-link" href="https://biograpi.ge/ka/sakeni" aria-label="SAKENI by Biograpi"><img class="bare-logo" src="logo.png" alt="SAKENI by Biograpi"></a>
<script>
/* BGP logo link v1: logo opens the project grid on biograpi.ge in the visitor's language.
   Language comes from ?lang=ka|en|ru (added to the 360 links on biograpi.ge by GTM),
   then from sessionStorage, else ka. Without JS the static href (ka) still works. */
(function () {
  var PATH = "sakeni";
  var a = document.getElementById("bgp-logo-link");
  if (!a) return;
  var lang = "ka", m = /[?&]lang=(ka|en|ru)(?:&|$)/.exec(location.search);
  try {
    if (m) { lang = m[1]; sessionStorage.setItem("bgp_lang", lang); }
    else if (/^(ka|en|ru)$/.test(sessionStorage.getItem("bgp_lang") || "")) lang = sessionStorage.getItem("bgp_lang");
  } catch (e) { if (m) lang = m[1]; }
  a.href = "https://biograpi.ge/" + lang + "/" + PATH;
})();
</script>
<div class="view-switch" id="switch"></div>
<script src="pannellum.js"></script>
<script>
  var VIEWS = [1,2,3,4];
  function scene(base){
    return {
      type:'multires',
      multiRes:{
        basePath:base, path:'/%l/%s%y_%x', fallbackPath:'/fallback/%s',
        extension:'jpg', tileResolution:512, maxLevel:4, cubeResolution:2600
      },
      hfov:100
    };
  }
  var scenes = {};
  VIEWS.forEach(function(n){ scenes['view'+n] = scene('view'+n); });
  var viewer = pannellum.viewer('pano', {
    default:{
      firstScene:'view1', autoLoad:true, autoRotate:-2, autoRotateInactivityDelay:3500,
      backgroundColor:[0.341,0.431,0.694], sceneFadeDuration:900,
      showControls:false, showZoomCtrl:false, showFullscreenCtrl:false,
      keyboardZoom:true, mouseZoom:true, minHfov:50, maxHfov:120, compass:false
    },
    scenes: scenes
  });
  // build switch buttons
  var sw = document.getElementById('switch');
  VIEWS.forEach(function(n){
    var b=document.createElement('button');
    b.textContent='ხედი '+n; b.id='btn-view'+n;
    if(n===1) b.className='active';
    b.onclick=function(){ viewer.loadScene('view'+n); };
    sw.appendChild(b);
  });
  viewer.on('scenechange', function(id){
    VIEWS.forEach(function(n){
      document.getElementById('btn-view'+n).classList.toggle('active', id==='view'+n);
    });
  });
</script>
</body>
</html>
